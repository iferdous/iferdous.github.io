<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ismam ferdous</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0a0a;
      --bg2:       #111111;
      --bg3:       #1a1a1a;
      --border:    #272727;
      --text:      #c8c8c8;
      --dim:       #555;
      --dimmer:    #2e2e2e;
      --green:     #4eff91;
      --blue:      #57c7ff;
      --yellow:    #ffe066;
      --pink:      #ff79c6;
      --red:       #ff5f57;
      --cursor:    #4eff91;
      --glow:      rgba(78,255,145,0.06);
      --tag-bg:    rgba(78,255,145,0.09);
      --tag-col:   #4eff91;
      --shadow:    0 40px 100px rgba(0,0,0,0.9);
      --scan:      rgba(0,0,0,0.035);
    }
    [data-theme="light"] {
      --bg:        #f2ede4;
      --bg2:       #e9e3d8;
      --bg3:       #dfd8cc;
      --border:    #c5bcad;
      --text:      #2a2520;
      --dim:       #7a7060;
      --dimmer:    #b5aca0;
      --green:     #1a7a3a;
      --blue:      #1a5fa8;
      --yellow:    #7a5f00;
      --pink:      #8a1a5a;
      --red:       #b03020;
      --cursor:    #1a7a3a;
      --glow:      rgba(26,122,58,0.05);
      --tag-bg:    rgba(26,122,58,0.1);
      --tag-col:   #1a7a3a;
      --shadow:    0 30px 80px rgba(0,0,0,0.15);
      --scan:      rgba(0,0,0,0.012);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      padding: 24px;
      transition: background 0.35s;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        var(--scan) 3px,
        var(--scan) 4px
      );
      pointer-events: none;
      z-index: 200;
    }

    /* CRT flicker */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: 0.94; }
      94%      { opacity: 1; }
      96%      { opacity: 0.97; }
      97%      { opacity: 1; }
    }
    body { animation: flicker 8s infinite; }

    /* ── WINDOW ── */
    .window {
      width: 100%;
      max-width: 900px;
      min-width: 340px;
      background: var(--bg2);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow:
        var(--shadow),
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 60px rgba(78,255,145,0.04),
        0 0 120px rgba(78,255,145,0.02);
      overflow: hidden;
      transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
      position: relative;
    }
    [data-theme="light"] .window {
      box-shadow:
        var(--shadow),
        0 0 0 1px rgba(0,0,0,0.04);
    }
    /* resize handle — bottom-right corner */
    .resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      cursor: se-resize;
      z-index: 50;
      opacity: 0.35;
      transition: opacity 0.2s;
      background:
        linear-gradient(135deg, transparent 40%, var(--dim) 40%, var(--dim) 45%, transparent 45%),
        linear-gradient(135deg, transparent 55%, var(--dim) 55%, var(--dim) 60%, transparent 60%),
        linear-gradient(135deg, transparent 70%, var(--dim) 70%, var(--dim) 75%, transparent 75%);
    }
    .resize-handle:hover { opacity: 0.9; }

    /* ── TITLEBAR ── */
    .titlebar {
      background: var(--bg3);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      user-select: none;
      transition: background 0.35s, border-color 0.35s;
    }
    .dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .win-title {
      color: var(--dim);
      font-size: 11px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    .theme-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 3px 10px;
      cursor: pointer;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      position: relative;
    }
    .theme-btn:hover { border-color: var(--green); color: var(--green); background: var(--glow); }

    /* ── STATUS BAR ── */
    .statusbar {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 5px 18px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 10px;
      color: var(--dimmer);
      letter-spacing: 0.05em;
      transition: background 0.35s, border-color 0.35s;
    }
    .s-item { display: flex; align-items: center; gap: 5px; }
    .s-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .s-val { color: var(--dim); }
    .s-right { margin-left: auto; }

    /* ── OUTPUT ── */
    .output {
      padding: 18px 20px 6px;
      min-height: 500px;
      max-height: 620px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text);
      transition: color 0.35s;
    }
    .output::-webkit-scrollbar { width: 3px; }
    .output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .line { white-space: pre-wrap; word-break: break-word; animation: fi 0.1s ease; }
    @keyframes fi { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }

    .c-green  { color: var(--green); }
    .c-blue   { color: var(--blue); }
    .c-yellow { color: var(--yellow); }
    .c-pink   { color: var(--pink); }
    .c-dim    { color: var(--dim); }
    .c-dimmer { color: var(--dimmer); }
    .c-red    { color: var(--red); }

    .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-col);
      border: 1px solid var(--tag-col);
      border-radius: 4px;
      padding: 0 6px;
      font-size: 10.5px;
      margin: 1px 2px;
      vertical-align: middle;
      opacity: 0.9;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    a.tl {
      color: var(--pink);
      text-decoration: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s, color 0.15s;
      cursor: pointer;
    }
    a.tl:hover { border-bottom-color: var(--pink); }

    /* project card */
    .pcard {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 3px 0 10px;
      background: var(--bg3);
      transition: border-color 0.2s, background 0.35s;
    }
    .pcard:hover { border-color: var(--green); }
    .pcard-title { color: var(--blue); font-weight: 700; font-size: 13px; }
    .pcard-desc  { color: var(--text); font-size: 12.5px; margin: 3px 0 5px; }
    .pcard-url   { display: inline-block; margin-top: 5px; font-size: 12px; }

    /* contact table */
    .ctable {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
      transition: border-color 0.35s;
    }
    .crow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .crow:last-child { border-bottom: none; }
    .crow:hover { background: var(--bg3); }
    .crow-label { color: var(--dim); font-size: 11px; min-width: 72px; letter-spacing: 0.04em; }
    .crow-arrow { color: var(--dimmer); }

    /* divider */
    hr.div { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

    /* ── INPUT ROW ── */
    .input-row {
      display: flex;
      align-items: center;
      padding: 4px 20px 16px;
      gap: 0;
    }
    .ps1 { font-size: 13px; white-space: nowrap; flex-shrink: 0; }
    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      cursor: text;
    }
    .input-mirror {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      white-space: pre;
      pointer-events: none;
      min-width: 0;
    }
    #cmd-input {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      caret-color: transparent;
      transition: color 0.35s;
    }
    ::placeholder { color: var(--dimmer); }

    /* ── HINT ── */
    .hint-bar {
      padding: 0 20px 13px;
      font-size: 10px;
      color: var(--dimmer);
      letter-spacing: 0.04em;
    }
    .hint-bar kbd {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin: 0 2px;
    }

    /* mobile tap row */
    .mob-row {
      display: none;
      padding: 0 14px 14px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mob-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 5px 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .mob-btn:hover { border-color: var(--green); color: var(--green); }
    @media (max-width: 600px) { .mob-row { display: flex; } }

    /* ── PHOTO GALLERY ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      margin: 6px 0 10px;
    }
    .photo-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg3);
      transition: border-color 0.2s, transform 0.15s;
      cursor: pointer;
    }
    .photo-card:hover { border-color: var(--text); transform: scale(1.02); }
    .photo-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: var(--bg3);
      font-size: 11px;
      color: var(--dim);
    }
    .photo-caption {
      padding: 5px 8px;
      font-size: 10.5px;
      color: var(--dim);
      border-top: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .photo-empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--dimmer);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── BLINKING CURSOR ── */
    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--cursor);
      border-radius: 1px;
      animation: cur 1.1s step-end infinite;
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--cursor);
      transition: background 0.3s, box-shadow 0.3s;
      pointer-events: none;
      vertical-align: middle;
      margin-left: 1px;
    }
    @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── TYPEWRITER for boot lines ── */
    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--cursor);
      animation: typing 0.4s steps(40,end) forwards, blink-caret 0.8s step-end 3;
    }
    @keyframes typing     { from{width:0} to{width:100%} }
    @keyframes blink-caret{ 0%,100%{border-color:var(--cursor)} 50%{border-color:transparent} }

    /* ── RESUME/CV COLOR CLASSES ── */
    .r-section {
      color: var(--yellow);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: block;
      padding-bottom: 3px;
      letter-spacing: 0.08em;
      font-size: 11px;
    }
    .r-role   { color: var(--blue);  font-weight: 700; }
    .r-place  { color: var(--green); }
    .r-period { color: var(--dim);   font-size: 11px; }
    .r-bullet { color: var(--text);  padding-left: 2px; }
    .r-tech   { color: var(--pink);  font-size: 11px; }
    .r-name   { color: var(--green); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; }
    .r-contact{ color: var(--dim);   font-size: 11.5px; }
    .r-skill-cat { color: var(--yellow); display:inline-block; min-width:120px; }
    .r-skill-val { color: var(--text); }
    .r-highlight { color: var(--green); font-weight: 700; }
    .r-course-code { color: var(--blue); display:inline-block; min-width:90px; }
    .r-course-desc { color: var(--dim); }
    .r-lead   { color: var(--pink); font-weight: 700; }
    .r-body   { color: var(--dim);  line-height: 1.9; }
  </style>
</head>

/* ══════════════════════════════ */

/* theme */
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.dataset.theme === 'dark';
  html.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('t-icon').textContent = dark ? '☾' : '☀';
  document.getElementById('t-lbl').textContent  = dark ? 'dark' : 'light';
}

/* dom helpers */
const outEl  = document.getElementById('out');
const inpEl  = document.getElementById('cmd-input');

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tag(t) { return `<span class="tag">${esc(t)}</span>`; }
function link(label, href) { return `<a class="tl" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`; }

function node(html, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' '+cls : '');
  d.innerHTML = html;
  outEl.appendChild(d);
  outEl.scrollTop = outEl.scrollHeight;
  return d;
}
function txt(text, cls) { node(esc(text), cls); }
function blank()        { txt(''); }
function hr()           { const e=document.createElement('hr'); e.className='div line'; outEl.appendChild(e); }
function echo(input) {
  node('<span class="c-green">ismam</span><span class="c-dim">@</span><span class="c-blue">portfolio</span><span class="c-dim">:~$</span> ' + esc(input));
}
function appendEl(el) { el.classList.add('line'); outEl.appendChild(el); outEl.scrollTop=outEl.scrollHeight; }

/* commands */
const CMDS = {

    [

  whoami() {

    node(`<span style="font-size:16px;font-weight:700;color:var(--green)">${esc(ME.name)}</span>`);

        card.className = 'photo-card';

        img.className = 'photo-img';
        img.src = p.src;

      });
      appendEl(grid);
    }
    blank();
  },

  // B&W grayscale color map
  function charToColor(ch) {
    if ('█'.includes(ch))           return '#111111';
    if ('▓'.includes(ch))           return '#2a2a2a';
    if ('▒'.includes(ch))           return '#444444';
    if ('╣╬╫╢'.includes(ch))        return '#606060';
    if ('╠╩╚'.includes(ch))         return '#888888';
    if ('░Ü'.includes(ch))          return '#aaaaaa';
    if ('▌▄ÑÆ'.includes(ch))        return '#cccccc';
    if ('»H;,_`'.includes(ch))      return '#dddddd';
    return '#505050';
  }

  // render each line as a <span>-colored div
  lines.forEach((line, i) => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = 'line';
      d.style.cssText = 'font-size:7.5px;line-height:1.15;letter-spacing:0.5px;white-space:pre;overflow:hidden';
      d.style.animation = 'fi 0.08s ease';
      let html = '';
      for (const ch of line) {
        const col = charToColor(ch);
        html += `<span style="color:${col}">${ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch}</span>`;
      }
      d.innerHTML = html;
      outEl.appendChild(d);
      outEl.scrollTop = outEl.scrollHeight;
    }, i * 28);
  });

  const totalDelay = lines.length * 28 + 80;
  setTimeout(() => { txt(''); }, totalDelay);
  setTimeout(() => { txt(`welcome. type  help  to start.`); }, totalDelay + 60);
  setTimeout(() => { txt(''); }, totalDelay + 80);
}

bootAscii();

/* run */
let hist=[], hidx=-1;
const ALL_CMDS = [...Object.keys(CMDS),'clear','cat','open','photos'];

function run(raw) {
  if (!raw.trim()) return;
  hist.unshift(raw); hidx=-1;
  echo(raw);
  const parts = raw.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts[1];
  if (cmd==='clear')  { outEl.innerHTML=''; bootAscii(); return; }
  if (cmd==='cat')    { catFile(arg); return; }
  if (cmd==='open')   { openLink(arg); return; }
  if (cmd==='photos') { CMDS.photos(); return; }
  if (CMDS[cmd])      { CMDS[cmd](); return; }
  txt(`command not found: ${cmd}`, 'c-red');
  txt('type  help  for available commands', 'c-dim');
  blank();
}

inpEl.addEventListener('keydown', e => {
  if (e.key==='Enter') { const v=inpEl.value; inpEl.value=''; run(v); }
  if (e.key==='ArrowUp')   { e.preventDefault(); if(hidx<hist.length-1)hidx++; inpEl.value=hist[hidx]||''; }
  if (e.key==='ArrowDown') { e.preventDefault(); hidx>0?(hidx--,inpEl.value=hist[hidx]):(hidx=-1,inpEl.value=''); }
  if (e.key==='Tab') {
    e.preventDefault();
    const p=inpEl.value.toLowerCase().trim();
    if(!p) return;
    const m=ALL_CMDS.find(c=>c.startsWith(p));
    if(m) inpEl.value=m;
  }
});

document.getElementById('win').addEventListener('click', ()=>inpEl.focus());

/* ── RESIZABLE WINDOW ── */
(function() {
  const win = document.getElementById('win');
  const handle = document.getElementById('resize-h');
  let dragging = false, startX, startY, startW, startH;

  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startW = win.offsetWidth;
    startH = win.offsetHeight;
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'se-resize';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(340, startW + (e.clientX - startX));
    const newH = Math.max(300, startH + (e.clientY - startY));
    win.style.maxWidth = 'none';
    win.style.width  = newW + 'px';
    const outEl2 = document.getElementById('out');
    if (outEl2) outEl2.style.maxHeight = Math.max(200, newH - 160) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });

  /* touch support */
  handle.addEventListener('touchstart', e => {
    const t = e.touches[0];
    dragging = true;
    startX = t.clientX; startY = t.clientY;
    startW = win.offsetWidth; startH = win.offsetHeight;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    const newW = Math.max(340, startW + (t.clientX - startX));
    const newH = Math.max(300, startH + (t.clientY - startY));
    win.style.maxWidth = 'none';
    win.style.width = newW + 'px';
    const outEl2 = document.getElementById('out');
    if (outEl2) outEl2.style.maxHeight = Math.max(200, newH - 160) + 'px';
  }, { passive: true });

  document.addEventListener('touchend', () => { dragging = false; });
})();

/* cursor — mirror typed text into visible span so cursor always follows */
const mirrorEl = document.getElementById('input-mirror');
function syncMirror() {
  if (mirrorEl) mirrorEl.textContent = inpEl.value;
}
inpEl.addEventListener('input', syncMirror);
inpEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') setTimeout(() => { if (mirrorEl) mirrorEl.textContent = ''; }, 10);
});
window.addEventListener('load', ()=>inpEl.focus());
